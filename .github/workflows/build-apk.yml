name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Materialize the signing key from repository secrets, if they are set.
      # Without them the build falls back to default debug signing (see
      # app/build.gradle.kts), so forks and first-time builds still work.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > theftguard.keystore
            cat > keystore.properties <<EOF
          storeFile=theftguard.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Signing key configured from secrets."
          else
            echo "No signing secrets set; using default debug signing."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TheftGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TheftGuard-apk
          path: TheftGuard.apk

      # Publish to a fixed "latest-apk" release so the phone can download it with one tap.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk TheftGuard.apk \
            --target "${{ github.sha }}" \
            --title "Theft Guard (latest build)" \
            --notes "Built from ${{ github.ref_name }} @ ${{ github.sha }}. Download TheftGuard.apk on your Android phone and install it (allow installing from unknown sources when asked)."
